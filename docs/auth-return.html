<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>חזרה לצעד קטן</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFF7EF;color:#3B2F4A;font-family:system-ui,Arial,sans-serif;text-align:center;padding:16px}
.c{max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}.e{font-size:3rem}
a{display:block;background:#FF7F50;color:#fff;text-decoration:none;border-radius:999px;padding:14px 22px;font-size:1.1rem}
@media (prefers-color-scheme:dark){body{background:#1D1A26;color:#F4EEF8}}</style></head>
<body><div class="c"><div class="e">🌱</div><h1 id="t">התחברת!</h1><p id="p">עכשיו חוזרים לאפליקציה.</p><a id="back" href="#">חזרה לאפליקציה</a></div>
<script>
/* Google sign-in for the Android app happens in the browser; this page hands the session back to the app through a tsaadkatan:// link */
const h=new URLSearchParams(location.hash.slice(1));
const at=h.get('access_token'),rt=h.get('refresh_token');
if(!at||!rt){document.getElementById('t').textContent='משהו לא הסתדר';document.getElementById('p').textContent='אפשר לחזור לאפליקציה ולנסות שוב.';}
const link='tsaadkatan://auth?at='+encodeURIComponent(at||'')+'&rt='+encodeURIComponent(rt||'');
document.getElementById('back').href=link;
history.replaceState(null,'',location.pathname);
if(at)setTimeout(()=>{location.href=link},300);
</script></body></html>
